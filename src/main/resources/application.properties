spring.application.name=demo

# spring.ai.openai.api-key=${Open_Api_Key}
# spring.ai.openai.chat.options.model=gpt-5.4-mini
# spring.ai.openai.chat.options.temperature=0.7

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7

# -> Gemini Embedding
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# --> Now here we want the redis configuration, so that we can connect with redis
# To use redis as vector-store

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Below we are use the redis client in java i.e -> jedis
spring.data.redis.client-type=jedis

# Now yha schema ka mtlb hai, ki hmm document ke liye schema prepare krke rkhe hue hai
# inside redis vector store
spring.ai.vectorstore.redis.initialize-schema=true

# Now yha hmne index prepare kiya hai on top of document in vector data-store
spring.ai.vectorstore.redis.index-name=GTA-VI-report

# Now yha hmne sbhi key value pair ke prefix mai embedding lga diya,
# Kyunki, isse embedding model unhi key-value ko lekr convert kr payega into chunk to vector, then vector to chunk
spring.ai.vectorstore.redis.prefix=embedding:

# --> Here we are define the size of our file that uploaded,
# Yani max 50mb tk ki hi file upload hogi and request size jo hoga voh 100mb hoga
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
